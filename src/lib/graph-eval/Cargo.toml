[package]
name = "graph-eval"
version = "0.1.0"
edition = "2021"

# graph-eval — the LDBC-SNB interactive short reads, expressed against BOTH
# engines (board task E3, the M3 milestone).
#
# One fixture, two implementations, identical results: that equivalence is what
# makes the Phase-4 benchmark numbers meaningful, because it proves the two
# systems are answering the same question. Queries live here rather than in
# either engine so neither can quietly special-case them.
#
# Evaluation code, not engine code — it depends on both engines and is not a
# candidate for upstreaming.

[lib]
crate-type = ["rlib"]

# Test-suite gating, so day-to-day `cargo start-qemu --tests` does not pay for
# this crate's suite. `xtask` writes one `test_bins` list and init runs every
# binary in it — there is no filter — so the only way to shorten a run is to
# make a crate's tests compile to nothing.
#
# `default = []` means a normal run skips them; set `default = ["tests"]` (or
# add the feature) when working on this crate. See the same pattern in
# twizzler-graph, which slices its own suite three ways.
[features]
default = []
tests = []

[dependencies]
twizzler = { path = "../twizzler" }
twizzler-abi = "*"
twizzler-rt-abi = "*"
twizzler-graph = { path = "../twizzler-graph" }
twizzler-indradb = { path = "../twizzler-indradb" }
# The baseline queries are written against IndraDB's public API directly.
indradb-lib = { version = "5.0.0", default-features = false }
uuid = "1"
