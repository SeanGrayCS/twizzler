[package]
name = "twizzler-indradb"
version = "0.1.0"
edition = "2021"

# The IndraDB baseline for the RQ2 comparison (board tasks D1/D2).
#
# D1 (this): depend on the unmodified upstream library and smoke-test its
# in-memory datastore on Twizzler, to find out what actually fails to build or
# run. Vendoring into src/ports/ is deliberately NOT done up front — we only
# fork if the port note says we must.
# D2: add `TwizzlerDatastore` (indradb::Datastore + Transaction) persisting to
# Twizzler objects.
#
# `indradb-lib` is the library; the `indradb` crate is the server (not wanted).
# default-features = false keeps the rocksdb datastore and its C++ toolchain
# out of the build.

# Test-suite gating, so day-to-day `cargo start-qemu --tests` does not pay for
# this crate's suite. `xtask` writes one `test_bins` list and init runs every
# binary in it — there is no filter — so the only way to shorten a run is to
# make a crate's tests compile to nothing.
#
# `default = []` means a normal run skips them; set `default = ["tests"]` (or
# add the feature) when working on this crate. See the same pattern in
# twizzler-graph, which slices its own suite three ways.
[features]
default = []
tests = []

[dependencies]
indradb-lib = { version = "5.0.0", default-features = false }
# Named directly by the key codec (indradb's public API uses uuid::Uuid);
# cargo unifies this with indradb-lib's own 1.x requirement.
uuid = "1"
# Property values are `indradb::Json` (a serde_json Value); we store them as
# serialized bytes in the KV store.
serde_json = "1"

twizzler = { path = "../twizzler" }
naming = { path = "../naming" }
twizzler-abi = "*"
twizzler-rt-abi = "*"
